<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Canvas Tracker{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>document.cookie = 'tz=' + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone) + '; path=/; max-age=604800; SameSite=Lax';</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; color: #1a1a1a; background: #f5f5f5; }

    header {
      background: #c0392b;
      color: #fff;
      padding: 0.7rem 1.5rem;
    }
    header a.brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.05rem; }

    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }

    .flash-list { list-style: none; margin-bottom: 1rem; }
    .flash-list li {
      padding: 0.65rem 1rem;
      border-radius: 4px;
      background: #fff3cd;
      border: 1px solid #e0a800;
      margin-bottom: 0.5rem;
    }

    /* ── NAV SEARCH — shared across every page, not just the course list ── */
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-search {
      position: relative;
      display: flex;
      align-items: center;
      width: 160px;
      height: 30px;
      background: rgba(255,255,255,0.08);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 15px;
      padding: 0 10px;
      cursor: text;
      transition: width 0.2s ease, background 0.2s ease;
    }
    .nav-search.expanded {
      width: 280px;
      background: rgba(255,255,255,0.12);
    }
    .nav-search-icon {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      color: rgba(255,255,255,0.45);
      transition: color 0.15s;
    }
    .nav-search.expanded .nav-search-icon { color: rgba(255,255,255,0.7); }
    .nav-search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 11px;
      color: #fff;
      padding: 0 6px;
      min-width: 0;
    }
    .nav-search-input::placeholder { color: rgba(255,255,255,0.35); }
    .nav-search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      min-width: 300px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 320px;
      overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
      z-index: 1000;
    }
    .nav-search-results:empty { display: none; }
    .search-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .search-result:last-child { border-bottom: none; }
    .search-result:hover { background: #fafaf8; }
    .search-result-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .search-dropped-tag {
      /* Fallback values: not every page's :root defines the tier-hot tokens. */
      font-family: var(--mono); font-size: 9px; color: var(--tier-hot-dot, #e8705a);
      background: var(--tier-hot-bg, #fef2f0); padding: 1px 5px; border-radius: 3px;
      margin-left: 6px; letter-spacing: 0.03em;
    }
    .search-result-section { font-family: var(--mono); font-size: 11px; color: var(--text-tertiary); letter-spacing: 0.04em; }
    .search-empty { padding: 12px 14px; font-size: 13px; color: var(--text-tertiary); }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>

<svg style="display:none">
  <symbol id="ico-msg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 3h12v8H9l-3 2v-2H2z"/>
  </symbol>
  <symbol id="ico-disc" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="6" r="3.5"/>
    <path d="M2 14c0-2.5 2.7-4 6-4s6 1.5 6 4"/>
  </symbol>
  <symbol id="ico-hw" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 2h7l3 3v9H3z"/>
    <path d="M10 2v3h3"/>
    <line x1="5.5" y1="7.5" x2="10.5" y2="7.5"/>
    <line x1="5.5" y1="9.8" x2="10.5" y2="9.8"/>
    <line x1="5.5" y1="12.1" x2="8.5" y2="12.1"/>
  </symbol>
  <symbol id="ico-grp" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 3h10v7H6l-2 2v-2H1z"/>
    <path d="M11 6h4v7h-3l-2 2v-2"/>
  </symbol>
</svg>

  {% block nav %}
  <header>
    <a class="brand" href="{{ url_for('dashboard.index') }}">Canvas Tracker</a>
  </header>
  {% endblock %}

  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-list">
          {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

<script>
// ── Student search (nav bar) — shared across every page ────────────────
(function () {
  var STUDENTS = {{ search_students | tojson }};
  var wrap     = document.getElementById('nav-search');
  var input    = document.getElementById('search-input');
  var results  = document.getElementById('search-results');
  if (!wrap) return;

  function expand() {
    wrap.classList.add('expanded');
    input.focus();
  }

  function collapse() {
    if (input.value.trim()) return;  // keep open while there's text
    wrap.classList.remove('expanded');
    results.innerHTML = '';
  }

  wrap.addEventListener('click', expand);

  input.addEventListener('blur', function () {
    // Delay so click on a result can fire first
    setTimeout(collapse, 150);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      input.value = '';
      results.innerHTML = '';
      wrap.classList.remove('expanded');
      input.blur();
    }
  });

  function escHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(matches) {
    results.innerHTML = '';
    if (!input.value.trim()) return;
    if (!matches.length) {
      results.innerHTML = '<div class="search-empty">No matches</div>';
      return;
    }
    matches.slice(0, 30).forEach(function (s) {
      var a = document.createElement('a');
      a.className = 'search-result';
      a.href = '/course/' + s.course_id + '/student/' + s.student_id;
      a.innerHTML =
        '<span class="search-result-name">' + escHtml(s.name) +
        (s.dropped ? ' <span class="search-dropped-tag">dropped</span>' : '') +
        '</span>' +
        '<span class="search-result-section">' + escHtml(s.section) + '</span>';
      results.appendChild(a);
    });
  }

  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase();
    if (!q) { results.innerHTML = ''; return; }
    // Names are stored "Last, First" — split the query into tokens so
    // "Sam Manandhar" matches "Manandhar, Sam" regardless of word order.
    var tokens = q.split(/\s+/).filter(Boolean);
    var matches = STUDENTS.filter(function (s) {
      var name = s.name.toLowerCase();
      return tokens.every(function (t) { return name.indexOf(t) !== -1; });
    });
    render(matches);
  });

  // ── Pre-fill from ?q=<name> (e.g. from the Contact Tracker Link extension)
  var qParam = new URLSearchParams(window.location.search).get('q');
  if (qParam) {
    history.replaceState(null, '', window.location.pathname);
    input.value = qParam;
    expand();
    input.dispatchEvent(new Event('input'));
  }
})();
</script>
</body>
</html>
